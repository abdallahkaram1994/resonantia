name: resonantia

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only, so host tools (pytest, psql) can connect. Not reachable from other machines.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # web embeds each search query. Empty values fall back to the defaults in settings.py.
      # The TMDB token is deliberately not passed: only host-run ingest needs it.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-}
      EMBEDDING_REQUESTS_PER_MINUTE: ${EMBEDDING_REQUESTS_PER_MINUTE:-}
      GEMINI_LLM_MODEL: ${GEMINI_LLM_MODEL:-}
      LLM_REQUESTS_PER_MINUTE: ${LLM_REQUESTS_PER_MINUTE:-}
      SEARCH_RESULT_LIMIT: ${SEARCH_RESULT_LIMIT:-}
      SEARCH_GROUP_LIMIT: ${SEARCH_GROUP_LIMIT:-}
      SEARCH_CANDIDATES_PER_TYPE: ${SEARCH_CANDIDATES_PER_TYPE:-}
      SEARCH_BLEND_MIN_SLOTS: ${SEARCH_BLEND_MIN_SLOTS:-}
      ITEM_SIMILAR_LIMIT: ${ITEM_SIMILAR_LIMIT:-}
      SEARCH_MAX_QUERY_LENGTH: ${SEARCH_MAX_QUERY_LENGTH:-}
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --access-logfile -
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    # Same image as web. It runs the background jobs in catalog/tasks.py (SPEC section 9b) and,
    # unlike web, receives the source keys, because ingest jobs call TMDB, IGDB and Last.fm.
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Host tools reach Postgres on localhost; from inside Compose it is the db service.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    command:
      - sh
      - -c
      - exec python manage.py procrastinate worker --queues ingest,maintenance --concurrency ${WORKER_CONCURRENCY:-2}
    depends_on:
      # web applies the migrations, including the queue's own tables, before it reports healthy.
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "manage.py", "procrastinate", "healthchecks"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
