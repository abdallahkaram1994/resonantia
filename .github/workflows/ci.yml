name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: resonantia
          POSTGRES_USER: resonantia
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resonantia -d resonantia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      POSTGRES_DB: resonantia
      POSTGRES_USER: resonantia
      POSTGRES_PASSWORD: ci-only-not-a-secret
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Create .env from the placeholder file
        run: cp .env.example .env
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Health check through Caddy
        run: |
          body=$(curl --fail --silent --show-error http://localhost:8080/api/health/)
          echo "$body"
          echo "$body" | grep -q '"pgvector":true'
      - name: Frontend is served at /
        run: |
          body=$(curl --fail --silent --show-error http://localhost:8080/)
          echo "$body" | grep -q '<title>Resonantia</title>'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
